<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <!-- Without this viewport tag a phone pretends to be a 980px-wide desktop and
       shrinks the whole page. This one line is what "works on mobile" hinges on. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medborgarskapsprovet – övning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app">

    <!--
      All three screens live in the page at once. JavaScript toggles the `hidden`
      attribute to show exactly one. That is the whole "single page app" idea:
      no page reloads, so no in-memory state is ever lost between screens.
    -->

    <!-- ============ SCREEN 1: START ============ -->
    <section id="screen-start" class="screen">
      <h1>Medborgarskapsprovet</h1>
      <p class="lede">Öva inför provet. <strong>8 frågor</strong>, inga konton, inget krångel.</p>
      <button id="btn-start" class="btn btn-primary" type="button">Starta quiz</button>
      <p id="load-error" class="feedback is-wrong" hidden></p>
    </section>

    <!-- ============ SCREEN 2: QUIZ ============ -->
    <section id="screen-quiz" class="screen" hidden>
      <!-- aria-live tells screen readers to announce this when it changes. -->
      <p id="progress" class="progress" aria-live="polite"></p>

      <h2 id="question-text" class="question"></h2>

      <!-- Option buttons are generated by JavaScript, not written here,
           because we do not know how many there are until the data loads. -->
      <div id="options" class="options"></div>

      <p id="feedback" class="feedback" aria-live="polite" hidden></p>

      <button id="btn-next" class="btn btn-primary" type="button" hidden></button>
    </section>

    <!-- ============ SCREEN 3: RESULT ============ -->
    <section id="screen-result" class="screen" hidden>
      <h2>Klart!</h2>
      <p id="score" class="score"></p>
      <p id="score-comment" class="lede"></p>
      <button id="btn-restart" class="btn btn-primary" type="button">Försök igen</button>
      <!-- TODO: "Repetera fel svar" button — filter to questions answered wrong. -->
    </section>

  </main>

  <!-- `defer` = download the script now, run it after the HTML is parsed.
       Without it, the script would run before the elements it looks for exist. -->
  <script src="app.js" defer></script>
</body>
</html>
